packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  workerd: true
minimumReleaseAgeExclude:
  - '@radix-ui/react-primitive@2.1.11'
  - '@radix-ui/react-slot@1.4.0'
  - '@radix-ui/react-switch@1.3.8'
  - '@radix-ui/react-use-size@1.1.5'
