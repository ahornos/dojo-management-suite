# ==============================================================================
# Dojo Management Suite — Docker Compose
# Build context is the monorepo root so every image can read pnpm-lock.yaml
# and workspace package.json files. Requires Docker BuildKit (Compose v2 default)
# for the shared pnpm store cache mount (`id=pnpm-store`).
#
# Profiles:
#   infra — postgres, redis
#   app   — Nest services + PWA
# Enable both for a full stack (`pnpm docker:up`). Teardown must pass the same
# profiles (`--profile infra --profile app`); a bare `docker compose down`
# selects no services and leaves the stack running.
# ==============================================================================

x-nest-healthcheck: &nest-healthcheck
  test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/docs"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 45s

services:
  postgres:
    image: postgres:15-alpine
    container_name: dms-postgres
    restart: always
    profiles: ["infra"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dojo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dojo_password}
      POSTGRES_DB: ${POSTGRES_DB:-dojo_management_suite}
    ports:
      - "5433:5432"
    volumes:
      - dms-pg-data:/var/lib/postgresql/data
    networks:
      - dms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dms-redis
    restart: always
    profiles: ["infra"]
    ports:
      - "6379:6379"
    volumes:
      - dms-redis-data:/data
    networks:
      - dms-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.nestjs-dev
      args:
        SERVICE_NAME: api-gateway
    container_name: dms-api-gateway
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api-gateway/src:/app/apps/api-gateway/src
      - ./packages:/app/packages
      - ./scripts:/app/scripts
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
    env_file:
      - .env
    networks:
      - dms-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      auth-service:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      financial-service:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.nestjs-dev
      args:
        SERVICE_NAME: auth-service
    container_name: dms-auth-service
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "3001:3000"
    volumes:
      - ./apps/auth-service/src:/app/apps/auth-service/src
      - ./packages:/app/packages
      - ./scripts:/app/scripts
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
    env_file:
      - .env
    networks:
      - dms-network
    healthcheck:
      <<: *nest-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  academic-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.nestjs-dev
      args:
        SERVICE_NAME: academic-service
    container_name: dms-academic-service
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "3002:3000"
    volumes:
      - ./apps/academic-service/src:/app/apps/academic-service/src
      - ./packages:/app/packages
      - ./scripts:/app/scripts
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
    env_file:
      - .env
    networks:
      - dms-network
    healthcheck:
      <<: *nest-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  financial-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.nestjs-dev
      args:
        SERVICE_NAME: financial-service
    container_name: dms-financial-service
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "3003:3000"
    volumes:
      - ./apps/financial-service/src:/app/apps/financial-service/src
      - ./packages:/app/packages
      - ./scripts:/app/scripts
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
    env_file:
      - .env
    networks:
      - dms-network
    healthcheck:
      <<: *nest-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  pwa-frontend:
    build:
      context: .
      dockerfile: apps/pwa-frontend/Dockerfile
      target: development
    container_name: dms-pwa-frontend
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "5173:5173"
    volumes:
      - ./apps/pwa-frontend:/app/apps/pwa-frontend
      - /app/node_modules
      - /app/apps/pwa-frontend/node_modules
    env_file:
      - .env
    networks:
      - dms-network
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  dms-pg-data:
  dms-redis-data:

networks:
  dms-network:
    driver: bridge
